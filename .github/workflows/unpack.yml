name: unpack
on:
  push:
    paths:
      - 'EasyDrive_src.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository contents with the uploaded archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/x
          unzip -q EasyDrive_src.zip -d /tmp/x
          test -f /tmp/x/EasyDrive/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/x/EasyDrive/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify on Pleos Connect Emulator v2.1.0; fix system bar overlap, car service reconnect, adaptive headlamp task" -m "Update README, screenshots, tests (45) and release APK." -m $'Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01NfWFDeF7GisGJwFsnvkdTE'
          git push
