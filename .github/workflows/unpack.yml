name: unpack
on:
  push:
    paths:
      - 'EasyDrive_src.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archive into repository root
        run: |
          set -e
          mkdir -p /tmp/x && unzip -q EasyDrive_src.zip -d /tmp/x
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/x/EasyDrive/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "EasyDrive: 실습 7과제·되돌림 확인·읽기 권한 7개, 에뮬레이터 최종 확인 반영" -m "Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01NfWFDeF7GisGJwFsnvkdTE"
          git push
